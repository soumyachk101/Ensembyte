[package]
name = "ensembyte-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "ensembyte_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "0.32"
ensembyte-markdown.workspace = true
ensembyte-text.workspace = true
ensembyte-doc.workspace = true
ensembyte-proto.workspace = true
ensembyte-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
ensembyte-syntax.workspace = true
thiserror.workspace = true
