name: release

# Build release artifacts and publish them:
#   - Linux headless tarballs (x86_64 + aarch64) via scripts/package-linux.sh
#   - Windows per-user installer, portable zip, and updater exe (x86_64) via
#     scripts/package-windows.ps1
# Note: macOS builds and DMGs are exclusively produced by Ensembyte-swift.
#
# Trigger: push a tag `v<version>` matching the workspace version in
# Cargo.toml (bump it in the same commit), or run manually via
# workflow_dispatch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cursor-compatibility:
    uses: ./.github/workflows/cursor-compatibility.yml

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Locate Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: package installer and portable app
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/soumyachk101/Ensembyte/releases/latest/download"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ runner.arch }}
          path: |
            target/package/*.zip
            target/package/*.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [cursor-compatibility, linux, windows]
    runs-on: ubuntu-latest
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b57dde68ee5964dccc025437b5478a5b
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: version guard (tag == artifact version)
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls dist/
          for platform in linux-x86_64.tar.gz linux-aarch64.tar.gz \
              windows-x86_64.zip windows-x86_64.exe windows-x86_64-setup.exe; do
            test -f "dist/ensembyte-$ver-$platform" \
              || { echo "missing artifact for tag v$ver: $platform — check builds and Cargo.toml version"; exit 1; }
          done
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: updater manifest
        run: |
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, files: {}}')
          for f in dist/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*
            manifest.json
          generate_release_notes: true
      - name: upload to R2 (ensembyte.sh/releases/*)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for f in dist/*; do
            npx wrangler@4 r2 object put "comet-native-releases/$(basename "$f")" \
              --file "$f" --remote
          done
          # manifest.json: version + per-artifact sha256 — the auto-updater
          # (crates/update) verifies downloads against it. Published before
          # latest.txt so no client ever sees a version without its checksums.
          npx wrangler@4 r2 object put comet-native-releases/manifest.json \
            --file manifest.json --remote
          printf '%s' "$VERSION" > latest.txt
          npx wrangler@4 r2 object put comet-native-releases/latest.txt \
            --file latest.txt --remote
