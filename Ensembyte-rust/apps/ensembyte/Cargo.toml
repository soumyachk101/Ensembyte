[package]
name = "ensembyte"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "ensembyte"


# Shared by both binaries; the UI is referenced only by `ensembyte`, so the
# background engine links without it.
[lib]
name = "ensembyte_app"
path = "src/lib.rs"

[[bin]]
name = "ensembyte"
path = "src/main.rs"

[[bin]]
name = "ensembyte-engine"
path = "src/bin/ensembyte-engine.rs"

[dependencies]
ensembyte-engine.workspace = true
ensembyte-rpc.workspace = true
ensembyte-ui.workspace = true
ensembyte-update.workspace = true
ensembyte-mcp.workspace = true
ensembyte-notify.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
