# cargo-deny configuration for Ensembyte
# Checks: license compliance, security advisories, duplicate dependencies, bans

[advisories]
# Deny all security advisories — no exceptions
deny = ["unmaintained", "unsound", "yanked"]
# Vulnerability DB: use the default (rustsec)

[licenses]
# Only allow these licenses across the entire workspace
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
]
# Files containing only these licenses are OK
confidence-threshold = 0.8
# Exceptions for specific crates
[[licenses.exceptions]]
name = "unicode-ident"
allow = ["MIT"]

[bans]
# Deny multiple versions of the same crate
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "deny"
# Deny git dependencies in release builds (optional, informational)
git = "warn"

[source]
# Only crates.io is allowed — no alternative registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
