name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature? We'd love to hear it. Please describe your idea and why it would be useful.

  - type: textarea
    attributes:
      label: Problem Statement
      description: What problem would this feature solve? Is there a related issue?
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Client
      description: Which client(s) would this affect?
      multiple: true
      options:
        - macOS (Swift)
        - Windows (Rust)
        - Linux (Rust)
        - Both

  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples about the feature request here.
      placeholder: "Screenshots, links, or references to similar features in other tools."
