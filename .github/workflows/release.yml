name: Release Pipeline (Windows & Linux)

# Ensembyte multi-platform release pipeline for Windows & Linux (Ensembyte-rust):
#   - Windows: Ensembyte-rust produces Ensembyte-windows-x86_64 installer & portable zip
#   - Linux: Ensembyte-rust produces Ensembyte-linux-x86_64.tar.gz
# Note: macOS (Ensembyte-swift) is built locally via `scripts/release-mac.sh` per AGENTS.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # =========================================================================
  # Windows Build (Exclusively Ensembyte-rust)
  # =========================================================================
  build-windows:
    name: Build Windows (Ensembyte-rust)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: Ensembyte-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Locate Windows SDK shader compiler (GPUI FXC)
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Ensembyte-rust

      - name: Package Windows Installer and Portable Zip
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/soumyachk101/Ensembyte/releases/latest/download"

      - name: Upload Windows Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          gh release upload "$tag" target/package/*.exe target/package/*.zip --repo soumyachk101/Ensembyte --clobber

  # =========================================================================
  # Linux Build (Exclusively Ensembyte-rust)
  # =========================================================================
  build-linux:
    name: Build Linux (Ensembyte-rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Ensembyte-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies for GPUI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Ensembyte-rust

      - name: Package Linux Tarball & Binaries
        run: scripts/package-linux.sh

      - name: Upload Linux Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          gh release upload "$TAG" target/package/*.tar.gz --repo soumyachk101/Ensembyte --clobber
