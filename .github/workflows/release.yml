name: Release Pipeline (Windows & Linux)

# Ensembyte multi-platform release pipeline for Windows & Linux (Ensembyte-rust):
#   - Windows: Ensembyte-rust produces Ensembyte-windows-x86_64 installer & portable zip
#   - Linux: Ensembyte-rust produces Ensembyte-linux-x86_64.tar.gz
# Note: macOS (Ensembyte-swift) is built locally via `scripts/release-mac.sh` per AGENTS.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: read
  # contents: write is granted per-job below only when needed

jobs:
  # =========================================================================
  # Windows Build (Exclusively Ensembyte-rust)
  # =========================================================================
  build-windows:
    name: Build Windows (Ensembyte-rust)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: Ensembyte-rust
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate release tag
        run: |
          $TAG = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:GITHUB_EVENT_INPUT_TAG
          } else {
            $env:GITHUB_REF_NAME
          }
          if (-not $TAG -or $TAG -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "Invalid or missing release tag: $TAG"
            exit 1
          }
          echo "TAG=$TAG" >> $env:GITHUB_ENV
          echo "Validating tag $TAG exists in repository..."
          $ref = gh api "repos/soumyachk101/Ensembyte/git/ref/tags/$TAG" --silent 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag $TAG does not exist in the repository. Aborting."
            exit 1
          }
          Write-Host "Tag $TAG validated successfully."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate Windows SDK shader compiler (GPUI FXC)
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          workspaces: Ensembyte-rust

      - name: Package Windows Installer and Portable Zip
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/soumyachk101/Ensembyte/releases/latest/download"

      - name: Upload Windows Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.TAG }}" target/package/*.exe target/package/*.zip --repo soumyachk101/Ensembyte --clobber

  # =========================================================================
  # Linux Build (Exclusively Ensembyte-rust)
  # =========================================================================
  build-linux:
    name: Build Linux (Ensembyte-rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Ensembyte-rust
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate release tag
        run: |
          TAG="${GITHUB_EVENT_NAME:-push}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "ERROR: Invalid or missing release tag: $TAG"
            exit 1
          fi
          echo "Validating tag $TAG exists in repository..."
          gh api repos/soumyachk101/Ensembyte/git/ref/tags/"$TAG" --silent > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "ERROR: Tag $TAG does not exist in the repository. Aborting."
            exit 1
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Tag $TAG validated successfully."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux system dependencies for GPUI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
        with:
          workspaces: Ensembyte-rust

      - name: Package Linux Tarball & Binaries
        run: scripts/package-linux.sh

      - name: Upload Linux Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.TAG }}" target/package/*.tar.gz --repo soumyachk101/Ensembyte --clobber
