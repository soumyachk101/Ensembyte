name: Windows & Linux Desktop (Rust)

# Ensembyte-rust builds exclusively for Windows and Linux.
# No macOS jobs are built or tested in this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'Ensembyte-rust/**'
      - '.github/workflows/rust-windows-linux.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Ensembyte-rust/**'
      - '.github/workflows/rust-windows-linux.yml'
  workflow_dispatch:

concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-build:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: Ensembyte-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Locate Windows SDK shader compiler (GPUI FXC)
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: Ensembyte-rust

      - name: Cargo Check Windows
        run: cargo check -p ensembyte

      - name: Cargo Clippy Windows
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Test Windows
        run: cargo test --locked -p orbit-engine --lib

  linux-build:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Ensembyte-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux system dependencies for GPUI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev

      - name: Setup Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: Ensembyte-rust

      - name: Cargo Check Linux
        run: cargo check -p ensembyte

      - name: Cargo Clippy Linux
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Test Linux
        run: cargo test --locked -p orbit-engine --lib

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version "^0.21"

      - name: Cargo Deny (licenses + advisories)
        run: |
          cargo install --locked cargo-deny --version "^0.15"
          cargo deny --workspace --log-level warn check all
