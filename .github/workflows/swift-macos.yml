name: macOS App (Swift)

# Quorumly-swift builds exclusively for macOS (Apple silicon / macOS 26+).
# Builds and tests the native Swift 6 / SwiftUI application and packages the disk image.

on:
  push:
    branches: [main]
    paths:
      - 'Quorumly-swift/**'
      - '.github/workflows/swift-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Quorumly-swift/**'
      - '.github/workflows/swift-macos.yml'
  workflow_dispatch:

concurrency:
  group: swift-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Quorumly macOS (Debug)
        run: |
          cd Quorumly-swift
          xcodebuild \
            -project Quorumly.xcodeproj \
            -scheme Quorumly \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify build artifacts
        run: |
          echo "macOS build completed successfully."
