name: macOS App (Swift)

# Ensembyte-swift builds exclusively for macOS (Apple silicon / macOS 26+).
# Builds and tests the native Swift 6 / SwiftUI application and packages the disk image.

on:
  push:
    branches: [main]
    paths:
      - 'Ensembyte-swift/**'
      - '.github/workflows/swift-macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Ensembyte-swift/**'
      - '.github/workflows/swift-macos.yml'
  workflow_dispatch:

concurrency:
  group: swift-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          cd Ensembyte-swift
          xcodebuild -resolvePackageDependencies \
            -project Ensembyte.xcodeproj \
            -scheme Ensembyte

      - name: Build Ensembyte macOS (Debug)
        run: |
          cd Ensembyte-swift
          xcodebuild \
            -project Ensembyte.xcodeproj \
            -scheme Ensembyte \
            -configuration Debug \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            OTHER_SWIFT_FLAGS="-DCOMPILER_PRE_MACOS26" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify build artifacts
        run: |
          echo "macOS build completed successfully."
