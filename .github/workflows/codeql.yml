name: Code Scanning (CodeQL)

# Runs CodeQL security analysis on both the Rust and Swift codebases.
# CodeQL identifies vulnerabilities, bugs, and code smells.

on:
  push:
    branches: [main]
    paths:
      - 'Ensembyte-rust/**'
      - 'Ensembyte-swift/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Ensembyte-rust/**'
      - 'Ensembyte-swift/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-rust:
    name: CodeQL Analysis (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  codeql-swift:
    name: CodeQL Analysis (Swift)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          cd Ensembyte-swift
          xcodebuild -resolvePackageDependencies \
            -project Ensembyte.xcodeproj \
            -scheme Ensembyte

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          queries: +security-extended

      - name: Build Swift project (for CodeQL)
        run: |
          cd Ensembyte-swift
          xcodebuild \
            -project Ensembyte.xcodeproj \
            -scheme Ensembyte \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -disableAutomaticPackageResolution \
            MACOSX_DEPLOYMENT_TARGET=15.0 \
            OTHER_SWIFT_FLAGS="-DCOMPILER_PRE_MACOS26" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
