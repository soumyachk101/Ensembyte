version: 2
updates:
  # Keep Rust dependencies updated
  - package-ecosystem: cargo
    directory: "/Ensembyte-rust"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "soumyachk101"
    labels:
      - "dependencies"
      - "rust"
    # Auto-merge patch updates after CI passes (uncomment if desired)
    # auto-merge: true

  # Keep GitHub Actions updated
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "soumyachk101"
    labels:
      - "dependencies"
      - "github-actions"
